<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURAKSHA - Register</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- GLOBAL THEME INITIALIZER (Prevents Flashing) -->
    <script>
        const savedTheme = localStorage.getItem("theme") || "blue";
        if (savedTheme === "red") {
            document.documentElement.setAttribute("data-theme", "red");
        }
    </script>

    <style>
        :root {
            /* DEFAULT BLUE CYBER THEME */
            --bg-main: #060b26;
            --bg-main-rgb: 6, 11, 38;
            --bg-card: #101935;
            --bg-card-rgb: 16, 25, 53;
            --bg-inner: #0b112c;
            
            --accent-primary: #00e5ff;
            --accent-primary-rgb: 0, 229, 255;
            --accent-secondary: #1d4ed8;
            --accent-secondary-rgb: 29, 78, 216;
            
            --text-muted: #94a3b8;
        }

        html[data-theme="red"] {
            /* PREMIUM RED BLACK CYBER THEME */
            --bg-main: #050505;
            --bg-main-rgb: 5, 5, 5;
            --bg-card: #0d0d0d;
            --bg-card-rgb: 13, 13, 13;
            --bg-inner: #0a0a0a;

            --accent-primary: #ff003c; 
            --accent-primary-rgb: 255, 0, 60;
            --accent-secondary: #8b0000; 
            --accent-secondary-rgb: 139, 0, 0;

            --text-muted: #7a7a7a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, rgba(var(--accent-secondary-rgb), 0.2) 0%, var(--bg-main) 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* --- NAVBAR (Glassmorphism) --- */
        .navbar-glass {
            background: rgba(var(--bg-main-rgb), 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 0;
            transition: all 0.4s ease;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .navbar-brand {
            font-size: 24px;
            color: var(--accent-primary) !important;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color 0.4s ease;
        }

        .nav-link {
            color: #cbd5e1 !important;
            font-weight: 500;
            margin: 0 10px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            color: var(--accent-primary) !important;
            text-shadow: 0 0 10px rgba(var(--accent-primary-rgb), 0.3);
        }

        /* Nav Theme Button */
        .theme-btn-nav {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-btn-nav:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-primary);
            border-color: var(--accent-primary);
            transform: rotate(15deg);
        }

        /* Nav Buttons */
        .btn-nav-login {
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }
        
        .btn-nav-login:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn-nav-register {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #ffffff;
            padding: 8px 24px;
            border-radius: 8px;
            font-weight: 700;
            border: none;
            box-shadow: 0 4px 15px rgba(var(--accent-primary-rgb), 0.2);
            transition: 0.3s;
        }
        
        .btn-nav-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(var(--accent-primary-rgb), 0.4);
            color: #ffffff;
        }

        /* --- Glassmorphic Premium Card --- */
        .register-card {
            width: 440px;
            background: rgba(var(--bg-card-rgb), 0.65);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        inset 0 0 20px rgba(var(--accent-primary-rgb), 0.05);
            position: relative;
            margin-top: 60px; /* Push down to avoid navbar overlap */
            transition: all 0.4s ease;
        }

        /* Cyber Glow Top Line */
        .register-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
            border-radius: 0 0 10px 10px;
            transition: background 0.4s ease;
        }

        .logo-box {
            text-align: center;
            font-size: 42px;
            color: var(--accent-primary);
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80px;
            width: 80px;
            background: rgba(var(--accent-primary-rgb), 0.05);
            border-radius: 20px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid rgba(var(--accent-primary-rgb), 0.15);
            box-shadow: 0 0 25px rgba(var(--accent-primary-rgb), 0.1);
            transition: all 0.4s ease;
        }

        h2 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 500;
            transition: color 0.4s ease;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group-custom i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: color 0.3s ease;
            z-index: 10;
        }

        .form-control {
            background: var(--bg-inner) !important;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #ffffff !important;
            padding: 14px 16px 14px 48px;
            border-radius: 14px;
            font-size: 15px;
            transition: all 0.3s ease;
            height: 52px;
        }

        .form-control::placeholder {
            color: #475569;
        }

        .form-control:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(var(--accent-primary-rgb), 0.15);
        }

        .form-control:focus + i {
            color: var(--accent-primary);
        }

        .form-label-custom {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
            letter-spacing: 0.5px;
            transition: color 0.4s ease;
        }

        /* Premium Glow Button */
        .btn-register-action {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            color: #ffffff;
            font-weight: 700;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            letter-spacing: 0.5px;
            transition: all 0.4s ease;
            height: 52px;
            box-shadow: 0 4px 20px rgba(var(--accent-primary-rgb), 0.25);
            margin-top: 15px;
        }

        .btn-register-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(var(--accent-primary-rgb), 0.4);
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
        }

        .btn-register-action:active {
            transform: translateY(1px);
        }

        .login-link {
            color: var(--text-muted);
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.4s ease;
        }

        .login-link a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-left: 4px;
        }

        .login-link a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(var(--accent-primary-rgb), 0.4);
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-glass">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-shield-lock-fill"></i> SURAKSHA
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center gap-3">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item ms-lg-2">
                    <a href="/login" class="btn btn-nav-login text-decoration-none">Login</a>
                </li>
                <li class="nav-item">
                    <a href="/register" class="btn btn-nav-register text-decoration-none" style="background: rgba(255, 255, 255, 0.1); color: white; box-shadow: none;">Get Started</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- REGISTER CARD -->
<div class="register-card">

    <div class="logo-box">
        <i class="bi bi-shield-lock-fill"></i>
    </div>

    <h2>Get Started</h2>
    <div class="subtitle">Create an account to run security scans</div>

    <form method="POST">

        <div>
            <label class="form-label-custom">USERNAME</label>
            <div class="input-group-custom">
                <input type="text"
                       class="form-control"
                       name="username"
                       placeholder="Choose a unique username"
                       required>
                <i class="bi bi-person"></i>
            </div>
        </div>

        <div>
            <label class="form-label-custom">EMAIL ADDRESS</label>
            <div class="input-group-custom">
                <input type="email"
                       class="form-control"
                       name="email"
                       placeholder="name@example.com"
                       required>
                <i class="bi bi-envelope"></i>
            </div>
        </div>

        <div>
            <label class="form-label-custom">PASSWORD</label>
            <div class="input-group-custom">
                <input type="password"
                       class="form-control"
                       name="password"
                       placeholder="••••••••"
                       required>
                <i class="bi bi-key"></i>
            </div>
        </div>

        <button type="submit" class="btn btn-register-action">
            Create Free Account <i class="bi bi-person-plus ms-1"></i>
        </button>

    </form>

    <div class="login-link">
        Already have an account? <a href="/login">Login here</a>
    </div>

</div>

<!-- Cross-Tab Theme Sync & Toggle Script -->
<script>
    // 1. Handle toggle button clicks on THIS page
    const themeBtn = document.getElementById("themeBtn");

    themeBtn.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "red" ? "blue" : "red";

        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);
    });

    // 2. Listen for theme changes from OTHER tabs
    window.addEventListener("storage", (event) => {
        if (event.key === "theme") {
            if (event.newValue === "red") {
                document.documentElement.setAttribute("data-theme", "red");
            } else {
                document.documentElement.removeAttribute("data-theme"); // Reverts to blue
            }
        }
    });
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
